    - generic [ref=f10e134]:
      - generic [ref=f10e135]:
        - generic [ref=f10e136]: What eBPCO does with your data today
        - paragraph [ref=f10e137]: Your account, applications, documents, payments and businesses are genuinely created, transmitted and stored by the Municipality of Castilla.
        - paragraph [ref=f10e138]: A document you attach is stored in full, not recorded by name only, and is retained for as long as your application or the resulting permit requires it. A permit that has genuinely been issued can be viewed on this portal and, once released, printed with its real permit number and conditions.
        - paragraph [ref=f10e139]: "One part remains unconnected: looking up a permit by number from the public, no-login verification page does not yet check this Municipality's real records. That page says so on its own."
      - generic [ref=f10e140]:
        - generic [ref=f10e141]: Who will control your data once eBPCO goes live
        - paragraph [ref=f10e142]: The personal information controller is the Local Government Unit of Castilla, Sorsogon. The Municipality states on its own permit forms that "all information we collect through this form shall be kept confidential by the Local Government Unit of Castilla and shall be used solely for legal purposes as mandated by the Data Privacy Act and other relevant laws."
        - paragraph [ref=f10e143]: You can reach the Office of the Municipal Engineer at 09054818572 or meocastilla@gmail.com, or in person at Castilla Town Hall, Cumadcad, Castilla, Sorsogon.
      - generic [ref=f10e144]:
        - generic [ref=f10e145]: What eBPCO will collect
        - paragraph [ref=f10e146]: "To create an account: your first, middle and last name, date of birth, sex, civil status, nationality, email address, mobile number and full address including barangay, city, province and postal code."
        - paragraph [ref=f10e147]: "To process a permit application: details of the project or establishment, and the documents each permit requires — which may include certified copies of land titles (OCT/TCT), deeds, survey plans, design plans, cost estimates, professional licences and a valid government ID."
        - paragraph [ref=f10e148]: Your account password is required to sign in and is never shown to anyone at the Municipality.
      - generic [ref=f10e149]:
        - generic [ref=f10e150]: Why it is collected
        - paragraph [ref=f10e151]: Solely to receive, evaluate, assess, approve and release the permits you apply for, and to contact you about those applications. Your data is not used for any other purpose, and it is never shared with another citizen's account.
      - generic [ref=f10e152]:
        - generic [ref=f10e153]: Your rights under the Data Privacy Act of 2012 (RA 10173)
        - paragraph [ref=f10e154]: As a data subject you have the right to be informed, to object, to access your data, to correct it, to have it erased or blocked, to damages for a violation, and to data portability.
        - paragraph [ref=f10e155]: You may exercise any of these rights by contacting the Municipality using the details above. If you believe your rights have been violated, you may complain to the National Privacy Commission.
      - generic [ref=f10e156]:
        - generic [ref=f10e157]: Not yet determined
        - paragraph [ref=f10e158]: "Three things this notice cannot yet tell you, because the Municipality has not published them and eBPCO will not invent them: how long your data will be retained, who the Municipality's Data Protection Officer is, and exactly which offices your application will be shared with during evaluation."
        - paragraph [ref=f10e159]: This section will be replaced with the Municipality's own answers once they are published. Your data is being collected and retained in the meantime — see the first section — under the general basis stated above (performance of a public task, PD 1096 permit issuance), not withheld until these specifics arrive.