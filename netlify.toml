# Netlify build settings for the eBPCO admin portal.
#
# Without this file the site's settings lived only in Netlify's UI, and they
# pointed at the repository root. The root has no index.html, so the site
# answered 404 at every page while still serving `/assets/...` — because this
# repo happens to have its own `assets/` folder at the root. The Angular build
# never ran at all: `/3rdpartylicenses.txt`, which only exists in build output,
# was a 404 too.
#
# Keeping it here rather than in the UI means the deploy is reviewable, and a
# change to it arrives with the code change that needs it.

[build]
  # The portal is not at the repository root — this is a monorepo that also
  # holds the mobile app and the design-system docs.
  # The space in the directory name is real; it is why this is quoted.
  base = "EBPCO WEB ADMIN/E-BPCO-Software-main"

  # `publish` is resolved relative to `base`. Angular's application builder
  # emits the browser bundle one level below the project output directory, so
  # `dist/e-bpco` is NOT it — `dist/e-bpco/browser` holds index.html.
  publish = "dist/e-bpco/browser"

  # `npm run build` now runs `write-runtime-config.mjs` first (see
  # package.json) — it writes `public/config.js` from EBPCO_API_BASE_URL /
  # EBPCO_USER_PORTAL_BASE_URL, which are set in `[build.environment]` below.
  # Left unset, the build ships a same-origin default — and that default is
  # exactly why every deploy before 19 Sep 2026 showed "The request failed"
  # on the login page (see the comment on EBPCO_API_BASE_URL below).
  command = "npm ci && npm run build"

  # ── Always build. Do not remove without reading this. ────────────────────
  #
  # Every deploy from 30 Aug 23:26 to 31 Aug 12:29 was CANCELLED — fourteen
  # commits, none published. The deploy log shows "Building: Complete" after
  # 3.775s and Deploying/Cleanup/Post-processing all "Skipped", which is far too
  # fast to have run `npm ci`. The build never started: Netlify decided nothing
  # had changed.
  #
  # The cause is the SPACE in `base`. Netlify's default change detection for a
  # site with a base directory compares the two commits limited to that path,
  # and an unquoted path splits into three pathspecs that match nothing:
  #
  #   git diff --quiet A B -- EBPCO WEB ADMIN/E-BPCO-Software-main
  #                            ^^^^^ ^^^ ^^^^^^^^^^^^^^^^^^^^^^^^
  #
  # Verified against this repository: quoted reports changes between a69dcba and
  # b87a7b5; unquoted reports none, and each of the three fragments matches zero
  # files. `a69dcba` was the last success because it had no cached commit to
  # compare against and so built unconditionally — then cached itself, and every
  # build since compared against it and skipped.
  #
  # `exit 1` means "never ignore, always build". The alternative is renaming the
  # directory, which is a bigger change to a repository another agent also
  # works in. A build here takes about a minute; a silently skipped deploy cost
  # two days.
  ignore = "exit 1"

[build.environment]
  # Angular 22. Netlify's default image can be older than Angular requires, and
  # a version resolved by chance is a build that breaks on their schedule
  # rather than ours.
  NODE_VERSION = "22"

  # ── Where the API is ─────────────────────────────────────────────────────
  #
  # Until 19 Sep 2026 this was unset, so `public/config.js` shipped
  # `EBPCO_API_BASE_URL = ""`, `ApiClient` posted the login to
  # https://ebpcowebadmin.netlify.app/auth/token — this site's OWN origin —
  # and Netlify answered with a 404 HTML page, which `toProblem` can only
  # render as "The request failed". The API was never asked.
  #
  # Now it is the API's real origin: the Linode at 139.162.51.165, running the
  # Compose stack in the backend repo's `apps/ebpco-api/deploy/`. The hostname
  # is sslip.io wildcard DNS — the IP spelled with dashes — because the LGU has
  # no domain for it yet; Let's Encrypt issues for it and Caddy on that host
  # holds the certificate. When a real hostname exists, change it HERE, in
  # `deploy/.env` (API_HOST) on the Linode, and in the citizen portal's
  # netlify.toml — the three must agree.
  #
  # Kept in this file, not Netlify's UI, for the same reason the rest of this
  # file exists: a value only in the UI is a value nobody can review, and the
  # first symptom of it being wrong is the login page. Scheme + host, no
  # trailing slash, no path.
  #
  # The API's CORS allowlist is PORTAL_BASE_URL on its side (security.ts), and
  # it is set to this site's origin, https://ebpcowebadmin.netlify.app. If this
  # site ever moves, that changes too, or every request fails in the browser
  # console with a CORS error and nothing in the API's logs.
  EBPCO_API_BASE_URL = "https://139-162-51-165.sslip.io"

  # The citizen-facing User Portal — a different application, origin and
  # repository. Only used to build the verification URL a permit's QR code
  # encodes; empty means no QR is rendered, since a QR pointing at the wrong
  # host is worse than none. Not derivable from the API's URL.
  EBPCO_USER_PORTAL_BASE_URL = "https://fastidious-chimera-7a7a18.netlify.app"

# ── There is a real API now, reached CROSS-ORIGIN, not through this file ──
#
# This site never proxies `/auth/*`, `/me`, `/staff/*` and so on to the API —
# there is deliberately no redirect rule for any of them here. `ApiClient`
# calls `API_BASE_URL` (from `public/config.js`, written at build time by
# `write-runtime-config.mjs` from EBPCO_API_BASE_URL in `[build.environment]`
# above) directly, which is an ABSOLUTE URL on the API's own origin, never a
# same-origin path on this Netlify site. The API's own CORS policy
# (`security.ts`, backend repo) is what allows this site's real deployed
# origin to call it — that origin is exactly `PORTAL_BASE_URL` on the API
# side, and the two have to be kept in agreement.
#
# This used to be a set of same-origin proxy redirects to `/index.html` with
# `status = 404`, on the theory that a real API would eventually sit behind
# this same gateway. That theory was never built: the redirects only ever
# 404'd every API call, silently, in whichever deploy forgot they were there.
# Removed rather than fixed forward, because the cross-origin + CORS path
# above is what is actually real and tested today. A same-origin gateway
# remains a legitimate choice (leave EBPCO_API_BASE_URL unset, and put a real
# reverse proxy in front of both this site and the API) — it just is not what
# this repository ships redirect rules for.
#
# Angular routes on the client. Without this every deep link — /login,
# /applications, /evaluations — is a 404 on refresh or when opened directly,
# because no file exists at that path. 200 rather than 301: the URL the officer
# sees must not change.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────────────
#
# Nothing here before this: Netlify's own defaults ship none of these. This
# is a staff-facing portal that handles real applicant PII behind a real
# login, so the gap was not cosmetic.
[[headers]]
  for = "/*"
  [headers.values]
    # No external script/style/font host: this app is fully self-contained
    # (checked against src/index.html — no third-party <script>/<link> tags).
    # `style-src` keeps 'unsafe-inline' for Angular's per-component <style>
    # tags, which this build (optimization disabled for "production" in
    # angular.json) emits without a nonce or hash to pin them to instead.
    # `connect-src` is 'self' plus the real API origin, since ApiClient calls
    # it cross-origin (see EBPCO_API_BASE_URL above) — everything else this
    # app talks to is itself.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://139-162-51-165.sslip.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    # A year, subdomains included. No `preload`: that is a one-way submission
    # to browsers' built-in preload list and a human call, not a default.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    # Belt-and-suspenders with frame-ancestors above, for browsers that only
    # honour the older header.
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No camera/mic/geolocation/USB anywhere in this app.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=()"
