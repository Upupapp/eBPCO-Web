<div class="modal-backdrop" (click)="cancelled.emit()">
  <div class="modal-box" (click)="$event.stopPropagation()" role="alertdialog" aria-modal="true">
    <button type="button" class="modal-close" aria-label="Close" (click)="cancelled.emit()">&#10005;</button>
    <h2>{{ title() }}</h2>
    @if (message()) {
      <p>{{ message() }}</p>
    }

    @if (reasonLabel(); as label) {
      <label class="modal-reason-label" for="confirm-reason">{{ label }}</label>
      <textarea
        id="confirm-reason"
        class="modal-reason"
        rows="3"
        name="confirmReason"
        [placeholder]="reasonPlaceholder()"
        [(ngModel)]="reason"
        (ngModelChange)="touched.set(false)"
      ></textarea>
      @if (touched() && reasonTooShort()) {
        <p class="modal-reason-error" role="alert">
          Please give a reason. It is stored with the record and is what anyone
          reading this later will have.
        </p>
      }
    }

    <div class="modal-actions">
      <button type="button" class="modal-btn neutral" (click)="cancelled.emit()">{{ cancelLabel() }}</button>
      <button
        type="button"
        class="modal-btn"
        [class.danger]="tone() === 'danger'"
        [class.confirm]="tone() !== 'danger'"
        (click)="onConfirm()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
