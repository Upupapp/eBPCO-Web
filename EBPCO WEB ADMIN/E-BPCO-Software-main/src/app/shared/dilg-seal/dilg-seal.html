@if (dimensional()) {
  <span class="seal-medallion" [style.width.px]="size()" [style.height.px]="size()">
    <img
      class="seal"
      src="/assets/logos/logo.png"
      alt="Municipality of Castilla, Sorsogon seal"
      [style.width.px]="size()"
      [style.height.px]="size()"
    />
    <span class="seal-sheen" aria-hidden="true"></span>
  </span>
} @else {
  <img
    class="seal"
    src="/assets/logos/logo.png"
    alt="Municipality of Castilla, Sorsogon seal"
    [style.width.px]="size()"
    [style.height.px]="size()"
  />
}
