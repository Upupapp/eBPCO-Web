<div class="splash-intro" (animationend)="onAnimationEnd($event)">
  <div class="splash-bg" aria-hidden="true"></div>

  <div class="brand-lockup">
    <span class="logo-wrap">
      <img
        class="intro-logo"
        src="assets/logos/logo.png"
        alt="E-BPCO — Municipality of Castilla, Sorsogon"
        draggable="false"
      />
      <span class="logo-spark" aria-hidden="true"></span>
    </span>

    <span class="title-reveal">
      <p class="intro-title">
        <span class="intro-title-base">
          <span class="intro-title-line1">E<span class="intro-dash">-</span>BPCO</span>
          <span class="intro-title-line2">Admin Portal</span>
        </span>
        <span class="intro-title-spark" aria-hidden="true">
          <span class="intro-title-line1">E<span class="intro-dash-spark">-</span>BPCO</span>
          <span class="intro-title-line2">Admin Portal</span>
        </span>
      </p>
    </span>
  </div>

  <p class="sr-only" role="status">Loading E-BPCO Web Admin Portal&hellip;</p>
</div>
