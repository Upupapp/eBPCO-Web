<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>E-BPCO Admin Portal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The Municipality of Castilla, Sorsogon seal — the same image every
         other seal in this app uses (dilg-seal, splash, document previews).
         Listed before the generic favicon.ico so browsers that support PNG
         icons (all current ones) prefer this over the placeholder CLI icon. -->
    <link rel="icon" type="image/png" href="/assets/logos/logo.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Runtime configuration, loaded BEFORE the application bundle so the
      injection-token factories see it when they first resolve. Plain JS with no
      build step, so a deploy can write it per environment. See public/config.js.
    -->
    <script src="config.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
