<span class="icon" [style.width.px]="size()" [style.height.px]="size()" aria-hidden="true">
  @switch (name()) {
    @case ('landmark') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <path d="M3 21h18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <path d="M4 21V10M8 21V10M12 21V10M16 21V10M20 21V10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <path d="M2.5 10 12 4l9.5 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    }
    @case ('users') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M3.5 20a5.5 5.5 0 0 1 11 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <circle cx="17" cy="8.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path d="M15.2 20a4.6 4.6 0 0 1 7.3-3.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
    }
    @case ('briefcase') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <rect x="3" y="7.5" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M3 12.5h18" stroke="currentColor" stroke-width="1.7" />
      </svg>
    }
    @case ('pin') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <path
          d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />
        <circle cx="12" cy="9.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.7" />
      </svg>
    }
    @case ('map') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6l-6-2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        <path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.6" />
      </svg>
    }
    @case ('flag') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <path d="M5 21V4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <path d="M5 4h13l-3 4 3 4H5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
      </svg>
    }
    @case ('chart') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <path d="M3 21h18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <path d="M6 21v-6M12 21V8M18 21v-10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>
    }
    @case ('grid') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <rect x="3" y="3" width="7" height="7" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6" />
        <rect x="14" y="3" width="7" height="7" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6" />
        <rect x="3" y="14" width="7" height="7" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6" />
        <rect x="14" y="14" width="7" height="7" rx="1.3" fill="none" stroke="currentColor" stroke-width="1.6" />
      </svg>
    }
    @case ('person') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M4.5 20a7.5 7.5 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>
    }
    @case ('landscape') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <path d="M2.5 19 8 10l3.2 4.6L14 11l7.5 8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        <circle cx="17.5" cy="6.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5" />
      </svg>
    }
    @case ('mail') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    }
    @case ('id') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <rect x="2.5" y="5" width="19" height="14" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7" />
        <circle cx="8.5" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M5.5 16a3.2 3.2 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <path d="M13.5 10h5M13.5 13h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    }
    @case ('calendar') {
      <svg viewBox="0 0 24 24" width="100%" height="100%">
        <rect x="3" y="5" width="18" height="16" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M3 9.5h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>
    }
  }
</span>
