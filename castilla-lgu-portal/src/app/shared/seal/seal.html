@if (dimensional()) {
  <span class="seal-medallion" [style.width.px]="size()" [style.height.px]="size()">
    <img
      class="seal"
      src="assets/logos/castilla-seal.png"
      alt="Official seal of the Municipality of Castilla, Sorsogon"
      [style.width.px]="size()"
      [style.height.px]="size()"
    />
    <span class="seal-sheen" aria-hidden="true"></span>
  </span>
} @else {
  <img
    class="seal"
    src="assets/logos/castilla-seal.png"
    alt="Official seal of the Municipality of Castilla, Sorsogon"
    [style.width.px]="size()"
    [style.height.px]="size()"
  />
}
