<header class="site-header" [class.scrolled]="scrolled()" [class.transparent]="transparent()">
  <div class="header-main">
    <a class="brand" routerLink="/" (click)="closeMobile()">
      <app-seal [size]="42" />
      <span class="brand-text">
        <span class="brand-title">Municipality of Castilla</span>
        <span class="brand-subtitle">LGU Information Portal</span>
      </span>
    </a>

    <nav class="primary-nav" aria-label="Primary">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="header-actions">
      <button type="button" class="announcements-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path
            d="M11 5 6 9H3v6h3l5 4V5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M15.5 8.5a4.5 4.5 0 0 1 0 7"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
        <span>Announcements</span>
      </button>

      <button
        type="button"
        class="mobile-toggle"
        [attr.aria-expanded]="mobileOpen()"
        aria-label="Toggle navigation menu"
        (click)="toggleMobile()"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  @if (mobileOpen()) {
    <nav class="mobile-nav" aria-label="Mobile primary">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          (click)="closeMobile()"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  }
</header>
