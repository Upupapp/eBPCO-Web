<section class="intro">
  <div class="intro-inner">
    <div class="intro-text reveal">
      <p class="eyebrow">About Castilla</p>
      <span class="intro-rule" aria-hidden="true"></span>
      <h1 class="intro-heading">
        <span class="intro-heading-line">Who and</span>
        <span class="intro-heading-line">where is <span class="accent">Castilla</span></span>
      </h1>

      <div class="intro-subtitle">
        <span class="intro-subtitle-icon"><app-icon name="landmark" [size]="20" /></span>
        <p>A concise overview of the municipality, its history, and its official identity.</p>
      </div>

      <p class="overview-text">{{ overview }}</p>
    </div>

    <!--
      Pre-stylized architectural artwork of the actual Castilla Municipal
      Hall (a posterized rose/red-on-transparent engraving treatment,
      already derived from the real building — not a drawn facade). Unlike
      the CSS-filtered raw-photo treatment used elsewhere on the site, this
      asset already carries its own color/edge treatment and transparent
      background, so it only needs sizing, a touch of opacity, and an
      edge-fade mask here — no grayscale/tint filter chain on top of it.
    -->
    <div class="intro-art" aria-hidden="true">
      <img src="assets/about/hall-bg.png" alt="" />
    </div>
  </div>
</section>

<section class="about-grid">
  <div class="about-grid-inner reveal">
    <article class="about-card">
      <span class="about-card-icon"><app-icon name="clock" [size]="24" /></span>
      <h3>History</h3>
      <span class="about-card-rule" aria-hidden="true"></span>
      <p class="card-text">{{ history }}</p>
    </article>

    <article class="about-card">
      <span class="about-card-icon"><app-icon name="target" [size]="24" /></span>
      <h3>Mission</h3>
      <span class="about-card-rule" aria-hidden="true"></span>
      <p class="card-text">{{ mission }}</p>
    </article>
  </div>
</section>

<section class="identity">
  <div class="identity-inner">
    <div class="identity-seal">
      <app-seal [size]="220" [dimensional]="true" />
    </div>
    <div class="identity-text">
      <p class="eyebrow">Municipal Identity</p>
      <h2>The Official Seal of Castilla</h2>
      <app-read-more [text]="sealDescription" [collapsedChars]="180" />
    </div>
  </div>
</section>
