<section class="page-intro">
  <div class="page-intro-inner">
    <app-section-heading
      eyebrow="Get in Touch"
      heading="Contact the Municipality"
      subtitle="Municipality of Castilla, Province of Sorsogon, Philippines."
    />
  </div>
</section>

<section class="contact-body">
  <div class="contact-body-inner">
    <dl class="contact-fields">
      @for (field of fields; track field.label) {
        <div class="contact-field">
          <dt>{{ field.label }}</dt>
          <dd>{{ field.value }}</dd>
        </div>
      }
    </dl>

    <div class="map-panel">
      <div class="map-frame">
        <iframe
          title="Castilla Municipal Hall location"
          [src]="mapEmbedUrl"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
      <p class="map-note">Castilla Municipal Hall, Cumadcad — along the Maharlika Highway.</p>
      <a class="directions-btn" [href]="directionsUrl" target="_blank" rel="noopener">Get Directions</a>
    </div>
  </div>
</section>
